parameters:
  navigation.runtime_scope_default: ''
  navigation.runtime_entity_default: ''

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      array $navigationConfig: '%navigation.config%'

  App\Navigating\:
    resource: '../src/'
    exclude:
      - '../src/Controller/'
      - '../src/DataFixtures/'
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel/'

  App\Navigating\Controller\:
    resource: '../src/Controller/'
    tags:
      - { name: controller.service_arguments }

  App\Navigating\Service\Cache\NavigationConfigCacheService:
    arguments:
      $cache: '@cache.app'

  App\Navigating\Form\Extension\NavigationEntityInvariantTypeExtension:
    tags:
      - { name: form.type_extension }

  App\Navigating\EventSubscriber\NavigationConfigCacheInvalidationSubscriber:
    autoconfigure: false
    tags:
      - { name: doctrine.event_subscriber }

  App\Navigating\EventSubscriber\NavigationAutoBackupSubscriber:
    autoconfigure: false
    tags:
      - { name: doctrine.event_subscriber }

  App\Navigating\EventSubscriber\NavigationEntityInvariantSubscriber:
    autoconfigure: false
    arguments:
      $invariants: '@App\Navigating\Service\Persistence\NavigationEntityInvariantService'
    tags:
      - { name: doctrine.event_subscriber }

  App\Navigating\ServiceInterface\Normalize\NavigationConfigNormalizeServiceInterface:
    alias: App\Navigating\Service\Normalize\NavigationConfigNormalizeService

  App\Navigating\ServiceInterface\Validate\NavigationConfigValidateServiceInterface:
    alias: App\Navigating\Service\Validate\NavigationConfigValidateService

  App\Navigating\ServiceInterface\Filter\NavigationVisibilityFilterServiceInterface:
    alias: App\Navigating\Service\Filter\NavigationVisibilityFilterService

  App\Navigating\ServiceInterface\Build\NavigationTreeBuildServiceInterface:
    alias: App\Navigating\Service\Build\NavigationTreeBuildService

  App\Navigating\ServiceInterface\Resolve\NavigationTargetResolveServiceInterface:
    alias: App\Navigating\Service\Resolve\NavigationTargetResolveService

  App\Navigating\ServiceInterface\Provide\NavigationRequestRoleProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationRequestRoleProvideService

  App\Navigating\ServiceInterface\Provide\NavigationRuntimeActivationProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationRuntimeActivationProvideService

  App\Navigating\ServiceInterface\Provide\NavigationDatabaseConfigProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationDatabaseConfigProvideService

  App\Navigating\Service\Provide\NavigationRuntimeActivationProvideService:
    arguments:
      $runtimeScope: '%env(default:navigation.runtime_scope_default:APP_RUNTIME_SCOPE)%'
      $runtimeEntity: '%env(default:navigation.runtime_entity_default:APP_RUNTIME_ENTITY)%'
      $runtimeActivationStrict: true

  App\Navigating\ServiceInterface\Provide\NavigationShellProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationShellProvideService

  App\Navigating\ServiceInterface\Provide\NavigationGroupProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationGroupProvideService

  App\Navigating\ServiceInterface\Provide\NavigationTemplateDataProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationTemplateDataProvideService

  navigating.template_data_provider:
    alias: App\Navigating\Service\Provide\NavigationTemplateDataProvideService
    public: true

  App\Navigating\ServiceInterface\Provide\NavigationShellPayloadProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationShellPayloadProvideService

  navigating.shell_payload_provider:
    alias: App\Navigating\Service\Provide\NavigationShellPayloadProvideService
    public: true

  App\Navigating\ServiceInterface\Provide\NavigationMobileShellPayloadProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationMobileShellPayloadProvideService

  App\Navigating\ServiceInterface\Provide\NavigationResponseProvideServiceInterface:
    alias: App\Navigating\Service\Provide\NavigationResponseProvideService

  navigating.response_provider:
    alias: App\Navigating\Service\Provide\NavigationResponseProvideService
    public: true

  App\Navigating\ProviderInterface\NavigationInterfaceLocationProjectionProviderInterface:
    alias: App\Navigating\Provider\NavigationInterfaceLocationProjectionProvider

  navigating.interface_location_projection_provider:
    class: App\Navigating\Provider\NavigationInterfaceLocationProjectionProvider
    public: true

  App\Navigating\ServiceInterface\Merge\NavigationShellChromeMergeServiceInterface:
    alias: App\Navigating\Service\Merge\NavigationShellChromeMergeService

  App\Navigating\ServiceInterface\Render\NavigationRenderServiceInterface:
    alias: App\Navigating\Service\Render\NavigationRenderService

  navigating.renderer:
    alias: App\Navigating\Service\Render\NavigationTemplateRenderService
    public: true

  App\Navigating\ServiceInterface\Render\NavigationTemplateRenderServiceInterface:
    alias: App\Navigating\Service\Render\NavigationTemplateRenderService

  App\Navigating\ServiceInterface\Render\NavigationRendererInterface:
    alias: App\Navigating\Service\Render\NavigationTemplateRenderService

  App\Navigating\Service\Twig\Navigation\NavigationTwigExtension:
    tags:
      - twig.extension

  App\Navigating\Service\Http\Navigation\NavigationHttpService:
    tags:
      - { name: controller.service_arguments }
