navigation:
  shell_locations:
    shell.mobile.bottom.primary:
      label: Mobile bottom navigation
      description: Primary mobile destinations rendered as Android NavigationBar or iOS TabView items.
      region: mobile
      slot: bottom.primary
      type: mobile_navigation
      priority: 10
      metadata:
        channel: mobile
        mobile_location: mobile.bottom.primary

    shell.mobile.account.quick:
      label: Mobile account quick menu
      description: Account actions opened from avatar or account toolbar button.
      region: mobile
      slot: account.quick
      type: mobile_sheet
      priority: 20
      metadata:
        channel: mobile
        mobile_location: mobile.account.quick

    shell.mobile.more.drawer:
      label: Mobile more drawer
      description: Mobile drawer or More tab list for secondary modules and Coming soon entries.
      region: mobile
      slot: more.drawer
      type: mobile_drawer
      priority: 30
      metadata:
        channel: mobile
        mobile_location: mobile.more.drawer

    shell.mobile.vendor.context:
      label: Mobile vendor context
      description: Vendor-owned contextual actions for mobile vendor workspace.
      region: mobile
      slot: vendor.context
      type: mobile_context
      priority: 40
      metadata:
        channel: mobile
        mobile_location: mobile.vendor.context

  shell_groups:
    mobile_bottom_primary:
      label: Primary
      location: shell.mobile.bottom.primary
      type: navigation
      priority: 10
      visible_for_roles: [ROLE_USER]
      visible_for_environments: [mobile]
      metadata:
        channel: mobile
        mobile_group: primary
      items:
        tasks:
          type: link
          label: Tasks
          icon: tasks
          priority: 10
          path: /vendor/project
          metadata:
            namespace_provider: App\Vendoring
            domain: vendor
            resource: vendor.project
            operation: index
            mobile_route: vendor/project
            mobile_platforms: [android, ios]
            runtime_entity: vendor
        message:
          type: link
          label: Messages
          icon: message
          priority: 20
          path: /message
          metadata:
            namespace_provider: App\Messaging
            domain: message
            resource: message
            operation: index
            mobile_route: message
            mobile_platforms: [android, ios]
        services:
          type: link
          label: Services
          icon: store
          priority: 30
          path: /vendor/retail
          metadata:
            namespace_provider: App\Vendoring
            domain: vendor
            resource: vendor.retail
            operation: index
            mobile_route: vendor/retail
            mobile_platforms: [android, ios]
            runtime_entity: vendor
        notification:
          type: link
          label: Notifications
          icon: notification
          priority: 40
          path: /notification
          metadata:
            namespace_provider: App\Messaging
            domain: notification
            resource: notification
            operation: index
            mobile_route: notification
            mobile_platforms: [android, ios]
        profile:
          type: link
          label: Profile
          icon: person
          priority: 50
          path: /vendor/profile
          metadata:
            namespace_provider: App\Vendoring
            domain: vendor
            resource: vendor.profile
            operation: show
            mobile_route: vendor/page
            mobile_platforms: [android, ios]

